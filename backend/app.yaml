runtime: nodejs24
instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 2

includes:
  - env.yaml

handlers:
  - url: /
    static_files: public/index.html
    upload: public/index.html
    secure: always

  - url: /quiz
    static_files: public/quiz.html
    upload: public/quiz.html
    secure: always

  - url: /(.*\.(css|js|png|jpg|svg|ico|woff2))$
    static_files: public/\1
    upload: public/.*\.(css|js|png|jpg|svg|ico|woff2)$
    secure: always

  - url: /api/.*
    script: auto
    secure: always
